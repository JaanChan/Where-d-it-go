name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Install Android 36.1 Platform
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env, Firebase Registered debug.keystore, and google-services.json
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          # CRITICAL: Write the exact project debug.keystore whose SHA-1 (5FE5248892868582458C39791CFD686FA11E0F29)
          # and SHA-256 (5EBC85D284ECBD5764A2B7120C008556A7362B1EDDB34A4C22580B632D62585A) are registered in Firebase
          # for Google Sign-In (CredentialManager) and App Check!
          cat << 'KEYSTORE_EOF' > debug.keystore.b64
          
          KEYSTORE_EOF
          tr -d ' \t\n\r' < debug.keystore.b64 | base64 -d > debug.keystore
          rm -f debug.keystore.b64
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256"

          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "435065094913",
              "project_id": "gen-lang-client-0744694157",
              "storage_bucket": "gen-lang-client-0744694157.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:435065094913:android:1e1c44b64004badb44d100",
                  "android_client_info": {
                    "package_name": "com.aistudio.whereditgo.mvkxqp"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "435065094913-u7r7soe2dctf0918muspgq13kbsrru6h.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.whereditgo.mvkxqp",
                      "certificate_hash": "5fe5248892868582458c39791cfd686fa11e0f29"
                    }
                  },
                  {
                    "client_id": "435065094913-oc2th0hrd0sf0fomahkes940dmhku56l.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyB9NuRlci5UXavrOegnTc5njE81i1iXmD8"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "435065094913-oc2th0hrd0sf0fomahkes940dmhku56l.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WheredItGo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
